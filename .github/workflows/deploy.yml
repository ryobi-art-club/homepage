name: Build and Deploy Ryobi Site

on:
  workflow_dispatch:

permissions:
  contents: read

# 公開を続けて押しても、ビルドは1つずつ順に動かす（古い内容のビルドが後から終わって、新しいサイトを上書きしないように）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to delete the previous image cache
    env:
      IMAGE_CACHE_KEY: drive-images-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # テストが通らなければ、ここで止まる（サイトは前の状態のまま）
      - name: Run tests
        run: python -m unittest discover tests

      # 秘密の値は環境変数で渡す（コマンドの文字に直接埋め込むと、値に ' などが入ったときにコマンドが壊れるため）
      - name: Restore Google service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json

      # 前回のビルドで取得した画像。公開リポジトリのキャッシュは、プルリクエストを作れる人なら誰でも
      # 読めるので、今のサイトに載っている画像だけを入れる（docs/reference/site.md の「画像のキャッシュ」）
      - name: Restore image cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache/drive
          key: ${{ env.IMAGE_CACHE_KEY }}
          restore-keys: drive-images-

      - name: Fetch Google content snapshot
        env:
          CONTENT_SPREADSHEET_ID: ${{ secrets.CONTENT_SPREADSHEET_ID }}
        run: |
          python scripts/fetch_google_content.py \
            --service-account-json /tmp/service-account.json \
            --content-spreadsheet-id "$CONTENT_SPREADSHEET_ID" \
            --output-json build/runtime/content_snapshot.json \
            --assets-dir build/runtime/assets \
            --cache-dir build/cache/drive

      - name: Build static site
        run: |
          python scripts/build_site.py \
            --static-config src/site_static.json \
            --content-snapshot build/runtime/content_snapshot.json \
            --assets-root build/runtime/assets \
            --output-dir dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 取得の手順で、サイトに使わなくなった画像はキャッシュから消してある。残りを保存し、古いキャッシュを消す。
      # ここで失敗しても次のビルドが遅くなるだけなので、公開は止めない
      - name: Save image cache
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/cache/drive
          key: ${{ env.IMAGE_CACHE_KEY }}

      - name: Delete older image caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key drive-images- --limit 100 --json key --jq '.[].key' \
            | { grep -vx "$IMAGE_CACHE_KEY" || true; } \
            | while read -r key; do gh cache delete "$key" --repo "$GITHUB_REPOSITORY"; done

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5