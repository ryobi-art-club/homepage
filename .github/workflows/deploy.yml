name: Build and Deploy Ryobi Site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore Google service account key
        run: |
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/service-account.json

      - name: Fetch Google content snapshot
        run: |
          python scripts/fetch_google_content.py             --service-account-json /tmp/service-account.json             --content-spreadsheet-id '${{ secrets.CONTENT_SPREADSHEET_ID }}'             --output-json build/runtime/content_snapshot.json             --assets-dir build/runtime/assets

      - name: Build static site
        run: |
          python scripts/build_site.py             --static-config src/site_static.json             --content-snapshot build/runtime/content_snapshot.json             --assets-root build/runtime/assets             --output-dir dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
